name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  reporting-contract:
    # Enforce the bundled reporting lib's self-contained + injection-safe
    # contract shipped with the investment-research-dashboard skill.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: pytest (reporting contract)
        run: >-
          uvx --with pandas --with numpy --with plotly pytest
          claude/skills/quant/investment-research-dashboard/reporting/test_reporting.py -q
