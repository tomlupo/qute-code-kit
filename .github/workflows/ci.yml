name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  reporting-contract:
    # Enforce the bundled reporting lib's self-contained + injection-safe
    # contract shipped with the investment-research-dashboard skill.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: pytest (reporting contract)
        run: >-
          uvx --with pandas --with numpy --with plotly pytest
          claude/skills/quant/investment-research-dashboard/reporting/test_reporting.py -q

  secret-scan:
    # No secrets or private infra details in a public repo (TOM-1257).
    # Rules: .gitleaks.toml. Known public-history findings: .gitleaksignore.
    # pull_request scans only the PR's commits; push to main scans all history.
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      # From the release's official gitleaks_8.30.1_checksums.txt.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: install gitleaks (pinned, checksum-verified)
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$tarball" -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: gitleaks
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            gitleaks git --no-banner --redact --config .gitleaks.toml \
              --log-opts="${BASE_SHA}..${HEAD_SHA}" .
          else
            gitleaks git --no-banner --redact --config .gitleaks.toml .
          fi
