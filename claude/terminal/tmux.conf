# tmux configuration for Claude Code
#
# Append to ~/.tmux.conf, then: tmux source-file ~/.tmux.conf
# `default-terminal` only takes effect for new sessions.
#
# Refs: https://code.claude.com/docs/en/terminal-config
#       https://code.claude.com/docs/en/fullscreen
# Why:  docs/cheatsheets/tmux-claude-code.md

# --- Claude Code ---

# Notifications + progress bar reach the outer terminal instead of being
# swallowed by tmux.
set -g allow-passthrough on

# Let tmux distinguish Shift+Enter from plain Enter (newline shortcut).
set -s extended-keys on

# extkeys: Shift+Enter.  RGB: true colour.  clipboard: OSC 52 copy over SSH.
set -as terminal-features 'xterm*:extkeys:RGB:clipboard'

# Required by the fullscreen renderer ("tui": "fullscreen") for mouse-wheel
# scrolling. Without it tmux forwards raw SGR mouse reports into the pane and
# they land as garbage text in the prompt.
set -g mouse on

# Let apps see OSC 52 clipboard writes (how Claude Code copies over SSH).
set -g set-clipboard on

# Tell the TUI when the pane gains/loses focus.
set -g focus-events on

# No Esc delay — the TUI leans on Esc chords.
set -s escape-time 0

# Correct terminfo inside tmux (italics, 256 colours, extended caps).
set -g default-terminal "tmux-256color"

# Deep scrollback for the classic renderer / tmux copy mode.
set -g history-limit 100000
