# lockfile-check — fail CI when `uv.lock` is out of step with `pyproject.toml`.
#
# OPT-IN template, stamped by `/setup-qute-repo` (Step 9, CI posture) into
# `.github/workflows/`. Installing the file IS the opt-in.
#
# ── Why ─────────────────────────────────────────────────────────────────────
# A project's OWN version appears in its lockfile (the root package is locked
# as `source = { editable = "." }` with its `version`). So every `/ship` bump
# staleness the lock, and until now nothing noticed: the stale lock is
# committed, CI is green, and the drift only surfaces later — at an install, a
# Docker build, or the next `uv sync` that silently rewrites the file inside an
# unrelated PR. Dependency edits made without re-locking drift the same way.
#
# `uv lock --check` resolves against `pyproject.toml` and exits non-zero if the
# committed lock would have to change. Verified against uv 0.11.3:
#   $ uv lock --check
#   The lockfile at `uv.lock` needs to be updated, but `--check` was provided.
# (`--check-exists` is a DIFFERENT flag — it only asserts the file is present
# and does not detect staleness. Do not swap them.)
#
# Fix when this goes red: run `uv lock` and commit the result.
#
# ── Degradation ─────────────────────────────────────────────────────────────
# Repos with no `uv.lock` (non-Python repos, apps that don't lock, plugin/doc
# repos) get a job that detects the absence, says so, and passes. The template
# is therefore safe to stamp uniformly; it becomes meaningful the moment a repo
# starts locking, with no second onboarding pass.
#
# The `push` branch list below is the one thing to adjust at stamp time: set it
# to the repo's default/release branch if that is not `main` (same substitution
# the review-gate template takes).

name: lockfile-check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: lockfile-check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  uv-lock-in-step:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Does this repo lock with uv?
        id: detect
        run: |
          set -euo pipefail
          if [ -f uv.lock ] && [ -f pyproject.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "uv.lock + pyproject.toml present — the lock will be checked."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No uv.lock (or no pyproject.toml) in this repo — nothing to check."
          fi

      - name: Install uv
        if: steps.detect.outputs.present == 'true'
        uses: astral-sh/setup-uv@v5

      - name: uv lock --check
        if: steps.detect.outputs.present == 'true'
        run: |
          set -uo pipefail
          if uv lock --check; then
            echo "OK: uv.lock is in step with pyproject.toml."
            exit 0
          fi
          echo "::error title=Stale uv.lock::uv.lock does not match pyproject.toml — the committed lock would have to change to satisfy it. Most often a version bump (the project's own version is recorded in its lockfile) or a dependency edit made without re-locking. Fix: run 'uv lock' and commit uv.lock."
          exit 1
